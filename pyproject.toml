[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flaker"
version = "0.3.0"
description = "Fast, modular Nix development environment and project scaffolding tool"
readme = "README.md"
authors = [{ name = "SpanishSyntax", email = "spanishsyntax@pyritelabs.cc" }]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["nix", "nixos", "flakes", "developer-tools", "scaffolding", "devshell"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
flaker = "flaker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flaker*"]

[tool.setuptools.package-data]
flaker = [
  "flake.template",
  "templates/**/*",
  "templates/*/*",
  "templates/*/*/*",
]
