[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "basecamp"
version = "0.3.0"
description = "Fast, modular Nix development environment and project scaffolding tool"
readme = "README.md"
authors = [{ name = "SpanishSyntax", email = "spanishsyntax@pyritelabs.cc" }]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["nix", "nixos", "flakes", "developer-tools", "scaffolding", "devshell"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "prism",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
basecamp = "basecamp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["basecamp*"]

[tool.setuptools.package-data]
basecamp = [
  "flake.template",
  "templates/**/*",
  "templates/*/*",
  "templates/*/*/*",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F841"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/ui.py" = ["F401"]
"**/ui/*.py" = ["F401"]
"**/ui/__init__.py" = ["F401"]
"**/tests/*" = ["F401", "F841"]
